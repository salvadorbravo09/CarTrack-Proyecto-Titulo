<div class="maintenance-form-container">
  <!-- Header -->
  <div class="row">
    <div class="col-12">
      <nav class="navbar navbar-expand-lg navbar-dark bg-secondary-custom">
        <div class="container">
          <a class="navbar-brand d-flex align-items-center" href="#">
            <i class="fas fa-car me-2"></i>
            <span class="fw-bold">CarTrack</span>
          </a>
          
          <div class="d-flex align-items-center">
            <span class="navbar-text me-3">
              Bienvenido, <!-- {{ currentUser.firstName }} -->
            </span>
            <button class="btn btn-outline-light">
              <i class="fas fa-sign-out-alt me-2"></i>
              Cerrar Sesión
            </button>
          </div>
        </div>
      </nav>
    </div>
  </div>

  <div class="maintenance-form-content">
    <div class="page-header">
      <div class="title-section">
        <h1 class="main-title">Seguimiento de Mantenimiento</h1>
        <button class="btn btn--primary btn--add-maintenance">
          <i class="fas fa-plus me-2"></i>
          Agregar Mantenimiento
        </button>
      </div>
    </div>

<!-- Formulario para registrar seguimiento de mantenimiento -->

    <!-- Card del formulario -->
    <section class="card card--padded">
      <!-- Formulario de Nuevo Registro -->
      <div class="new-maintenance-form">
        <div class="form-header">
          <h2 class="form-title">Nuevo Registro de Mantenimiento</h2>
          <p class="form-subtitle">Registra un nuevo mantenimiento, reparación o servicio</p>
        </div>

        <div class="card__body">
          <div class="form-grid">
            <!-- Vehículo -->
            <div class="form-group">
              <label for="vehiculo">Vehículo *</label>
              <div class="select-wrapper">
                <select id="vehiculo" name="vehiculo" class="form-control">
                  <option value="">Selecciona un vehículo</option>
                </select>
                <span class="select-caret" aria-hidden="true"></span>
              </div>
            </div>

            <!-- Tipo de Mantenimiento -->
            <div class="form-group">
              <label for="tipoMantenimiento">Tipo de Mantenimiento *</label>
              <div class="select-wrapper">
                <select id="tipoMantenimiento" name="tipoMantenimiento" class="form-control">
                  <option value="">Selecciona el tipo</option>
                  <option value="cambio-aceite">Cambio de Aceite</option>
                  <option value="revision-general">Revisión General</option>
                  <option value="cambio-filtros">Cambio de Filtros</option>
                  <option value="cambio-neumaticos">Cambio de Neumáticos</option>
                  <option value="alineacion-balanceo">Alineación y Balanceo</option>
                  <option value="cambio-frenos">Cambio de Frenos</option>
                  <option value="revision-suspension">Revisión de Suspensión</option>
                  <option value="cambio-bateria">Cambio de Batería</option>
                  <option value="reparacion-motor">Reparación de Motor</option>
                  <option value="otros">Otros</option>
                </select>
                <span class="select-caret" aria-hidden="true"></span>
              </div>
            </div>

            <!-- Fecha -->
            <div class="form-group">
              <label for="fecha">Fecha *</label>
              <input id="fecha" name="fecha" type="date" class="form-control" value="2025-10-11" />
            </div>

            <!-- Kilometraje -->
            <div class="form-group">
              <label for="kilometraje">Kilometraje</label>
              <input id="kilometraje" name="kilometraje" type="number" class="form-control" placeholder="0" min="0" />
            </div>

            <!-- Costo -->
            <div class="form-group form-group--span-2">
              <label for="costo">Costo (CLP)</label>
              <input id="costo" name="costo" type="number" class="form-control" placeholder="0" min="0" />
            </div>
          </div>

          <!-- Descripción -->
          <div class="form-group form-group--full-width">
            <label for="descripcion">Descripción *</label>
            <textarea 
              id="descripcion" 
              name="descripcion" 
              class="form-control form-control--textarea" 
              rows="4"
              placeholder="Describe el mantenimiento realizado...">
            </textarea>
          </div>
        </div>

        <footer class="card__footer">
          <div class="footer-actions">
            <button class="btn btn--ghost" type="button">Cancelar</button>
            <button class="btn btn--primary" type="submit">Guardar Registro</button>
          </div>
        </footer>
      </div>
    </section>
  </div>
</div>
