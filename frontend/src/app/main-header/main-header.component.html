<!-- Header -->
    <nav class="navbar navbar-dark bg-secondary-custom">
        <div class="container-fluid px-4">
        <a class="navbar-brand d-flex align-items-center">
            <i [class]="iconClass"></i>
            <span class="fw-bold fs-5">{{ brandText }}</span>
        </a>

        <div class="d-flex align-items-center gap-3">
            <!-- Botón Admin (solo si es admin) -->
            <a *ngIf="currentUser?.role === 'ADMIN'" 
               routerLink="/admin/usuarios" 
               class="btn btn-warning btn-sm">
              <i class="fas fa-users-cog me-2"></i>
              Panel Admin
            </a>
            
            <span class="text-white" *ngIf="currentUser">
              Bienvenido, {{ currentUser.firstName || 'Usuario Demo' }}
              <span *ngIf="currentUser.role === 'ADMIN'" class="badge bg-danger ms-2">ADMIN</span>
            </span>
            
            <button *ngIf="showLogout" class="btn btn-outline-light btn-sm" (click)="onLogout()">
              <i class="fas fa-sign-out-alt me-2"></i>
              Cerrar Sesión
            </button>
        </div>
        </div>
    </nav>
