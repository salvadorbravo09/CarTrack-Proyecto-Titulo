<div class="dashboard-container">
  <div class="container-fluid">
    <!-- Header -->
    <div class="row">
      <div class="col-12">
        <nav class="navbar navbar-expand-lg navbar-dark bg-secondary-custom">
          <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="#">
              <i class="fas fa-car me-2"></i>
              <span class="fw-bold">CarTrack</span>
            </a>
            
            <div class="d-flex align-items-center">
              <span class="navbar-text me-3" *ngIf="currentUser">
                Bienvenido, {{ currentUser.firstName }}
              </span>
              <button class="btn btn-outline-light" (click)="logout()">
                <i class="fas fa-sign-out-alt me-2"></i>
                Cerrar Sesión
              </button>
            </div>
          </div>
        </nav>
      </div>
    </div>

    <!-- Main Content -->
    <div class="row mt-4">
      <div class="col-12">
        <div class="container">
          <div class="welcome-card mb-4">
            <div class="card">
              <div class="card-body text-center py-5">
                <i class="fas fa-car fa-4x text-primary mb-3"></i>
                <h1 class="card-title">¡Bienvenido a CarTrack!</h1>
                <p class="card-text lead" *ngIf="currentUser">
                  Hola {{ currentUser.firstName }}, has iniciado sesión exitosamente.
                </p>
                <p class="text-muted">
                  Aquí podrás gestionar todos tus vehículos, mantenimientos y gastos.
                </p>
              </div>
            </div>
          </div>

          <!-- Quick Stats -->
          <div class="row">
            <div class="col-md-3 mb-3">
              <div class="card bg-primary text-white">
                <div class="card-body">
                  <div class="d-flex justify-content-between">
                    <div>
                      <h4>0</h4>
                      <p class="mb-0">Vehículos</p>
                    </div>
                    <i class="fas fa-car fa-2x opacity-50"></i>
                  </div>
                </div>
              </div>
            </div>
            <div class="col-md-3 mb-3">
              <div class="card bg-success text-white">
                <div class="card-body">
                  <div class="d-flex justify-content-between">
                    <div>
                      <h4>0</h4>
                      <p class="mb-0">Mantenimientos</p>
                    </div>
                    <i class="fas fa-wrench fa-2x opacity-50"></i>
                  </div>
                </div>
              </div>
            </div>
            <div class="col-md-3 mb-3">
              <div class="card bg-warning text-dark">
                <div class="card-body">
                  <div class="d-flex justify-content-between">
                    <div>
                      <h4>$0</h4>
                      <p class="mb-0">Gastos Totales</p>
                    </div>
                    <i class="fas fa-dollar-sign fa-2x opacity-50"></i>
                  </div>
                </div>
              </div>
            </div>
            <div class="col-md-3 mb-3">
              <div class="card bg-info text-white">
                <div class="card-body">
                  <div class="d-flex justify-content-between">
                    <div>
                      <h4>0</h4>
                      <p class="mb-0">Reportes</p>
                    </div>
                    <i class="fas fa-chart-bar fa-2x opacity-50"></i>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Actions -->
          <div class="row mt-4">
            <div class="col-12">
              <div class="card">
                <div class="card-header">
                  <h5 class="mb-0">Acciones Rápidas</h5>
                </div>
                <div class="card-body">
                  <div class="row">
                    <div class="col-md-4 mb-3">
                      <button class="btn btn-primary w-100 py-3">
                        <i class="fas fa-plus me-2"></i>
                        Agregar Vehículo
                      </button>
                    </div>
                    <div class="col-md-4 mb-3">
                      <button class="btn btn-success w-100 py-3">
                        <i class="fas fa-wrench me-2"></i>
                        Registrar Mantenimiento
                      </button>
                    </div>
                    <div class="col-md-4 mb-3">
                      <button class="btn btn-info w-100 py-3">
                        <i class="fas fa-chart-line me-2"></i>
                        Ver Reportes
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
