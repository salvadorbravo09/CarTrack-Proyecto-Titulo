<div class="login-container">
  <div class="login-card">
    <!-- Logo -->
    <div class="text-center mb-4">
      <div class="logo">
        <i class="fas fa-car text-primary me-2"></i>
        <span class="logo-text">CarTrack</span>
      </div>
    </div>

    <!-- Form Card -->
    <div class="form-card">
      <div class="form-header text-center mb-4">
        <h2 class="form-title">Iniciar Sesión</h2>
        <p class="form-subtitle text-muted">
          Ingresa tus credenciales para acceder a tu cuenta
        </p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <!-- Correo Electrónico -->
        <div class="form-group mb-3">
          <label for="email" class="form-label">Correo Electrónico</label>
          <input
            type="email"
            class="form-control"
            id="email"
            formControlName="email"
            placeholder="ejemplo@correo.com"
            [class.is-invalid]="isFieldInvalid('email')"
          />
          <div class="invalid-feedback" *ngIf="isFieldInvalid('email')">
            <span *ngIf="loginForm.get('email')?.errors?.['required']"
              >El correo electrónico es requerido</span
            >
            <span *ngIf="loginForm.get('email')?.errors?.['email']"
              >Ingresa un correo electrónico válido</span
            >
          </div>
        </div>

        <!-- Contraseña -->
        <div class="form-group mb-4">
          <label for="password" class="form-label">Contraseña</label>
          <div class="password-input-container">
            <input
              [type]="showPassword ? 'text' : 'password'"
              class="form-control"
              id="password"
              formControlName="password"
              placeholder="••••••••"
              [class.is-invalid]="isFieldInvalid('password')"
            />
            <button
              type="button"
              class="password-toggle-btn"
              (click)="togglePasswordVisibility()"
            >
              <i [class]="showPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
            </button>
          </div>
          <div class="invalid-feedback" *ngIf="isFieldInvalid('password')">
            La contraseña es requerida
          </div>
        </div>

        <!-- Error Message -->
        <div class="alert alert-danger" *ngIf="errorMessage" role="alert">
          <i class="fas fa-exclamation-triangle me-2"></i>
          {{ errorMessage }}
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          class="btn btn-primary btn-lg w-100 mb-3"
          [disabled]="loginForm.invalid || isLoading"
        >
          <span
            *ngIf="isLoading"
            class="spinner-border spinner-border-sm me-2"
            role="status"
          ></span>
          {{ isLoading ? "Iniciando sesión..." : "Iniciar Sesión" }}
        </button>

        <!-- Register Link -->
        <div class="text-center">
          <span class="text-muted">¿No tienes una cuenta? </span>
          <a
            href="#"
            class="text-primary text-decoration-none fw-medium"
            (click)="goToRegister($event)"
          >
            Regístrate aquí
          </a>
        </div>
      </form>
    </div>

    <!-- Back to Home -->
    <div class="text-center mt-4">
      <a
        href="#"
        class="text-muted text-decoration-none"
        (click)="goBack($event)"
      >
        <i class="fas fa-arrow-left me-2"></i>
        Volver al inicio
      </a>
    </div>
  </div>
</div>
