<app-main-header></app-main-header>
<app-main-nav [activeTab]="'vehiculos'"></app-main-nav>

<div class="container py-4">
  <div class="card p-4 mx-auto" style="max-width:720px;">
    <h4 class="mb-3">Transferir vehículo</h4>

    <div *ngIf="feedback" class="alert" [ngClass]="{'alert-info': !isLoading, 'alert-warning': isLoading}">
      {{ feedback }}
    </div>

    <form #f="ngForm" (ngSubmit)="onSubmit(f)">
      <div class="mb-3">
        <label class="form-label">Email del nuevo propietario</label>
        <input name="transferEmail" [(ngModel)]="transferEmail" required email class="form-control" />
      </div>

      <div class="mb-3">
        <label class="form-label">Mensaje (opcional)</label>
        <textarea name="message" [(ngModel)]="message" rows="4" class="form-control"></textarea>
      </div>

      <div class="d-flex justify-content-end gap-2">
        <button type="button" class="btn btn-secondary" (click)="cancel()">Cancelar</button>
        <button type="submit" class="btn btn-primary" [disabled]="isLoading">{{ isLoading ? 'Enviando...' : 'Iniciar transferencia' }}</button>
      </div>
    </form>
  </div>
</div>
