<div class="soap-form-container">
  <app-main-header [currentUser]="currentUser" (logout)="logout()"></app-main-header>

  <div class="soap-form-content">
    <section class="card card--padded">
      <header class="card__header">
        <a class="btn btn--link btn--back" (click)="onCancel()" style="cursor: pointer;">&larr; Volver</a>
        <h2 class="card__title">Registrar Seguro Vehicular</h2>
      </header>

      <div class="card__body">
        <div *ngIf="successMessage" class="alert alert-success mb-3" role="alert">
          <i class="fas fa-check-circle me-2"></i>
          {{ successMessage }}
        </div>

        <div *ngIf="errorMessage" class="alert alert-danger mb-3" role="alert">
          <i class="fas fa-exclamation-circle me-2"></i>
          {{ errorMessage }}
        </div>

        <div *ngIf="vehicleInfo" class="alert alert-info mb-4">
          <strong><i class="fas fa-car me-2"></i>Vehículo:</strong> 
          {{ vehicleInfo.brand }} {{ vehicleInfo.model }} {{ vehicleInfo.year }} 
          <span class="badge bg-primary ms-2">{{ vehicleInfo.licensePlate }}</span>
        </div>

        <p class="muted">Completa la información del seguro vehicular asociado a tu vehículo.</p>
        
        <form #seguroForm="ngForm" (ngSubmit)="onSubmit(seguroForm)">
          <h3 class="section-title">Datos del Seguro</h3>
          
          <div class="form-grid">

            <div class="form-group">
              <label for="compania">Compañía Aseguradora *</label>
              <input type="text" id="compania" name="compania" class="form-control" 
                     [(ngModel)]="seguroData.compania" required 
                     placeholder="Ej: HDI, BCI, Consorcio, Liberty...">
            </div>

            <div class="form-group">
              <label for="tipoCobertura">Tipo de Cobertura *</label>
              <select id="tipoCobertura" name="tipoCobertura" class="form-control" 
                      [(ngModel)]="seguroData.tipoCobertura" required>
                <option value="" disabled>Seleccione una opción...</option>
                <option value="basica">Básica (Responsabilidad Civil)</option>
                <option value="intermedia">Intermedia (Daños a Terceros)</option>
                <option value="completa">Completa (Todo Riesgo)</option>
              </select>
            </div>

            <div class="form-group">
              <label for="fechaInicio">Fecha Inicio Vigencia *</label>
              <input type="date" id="fechaInicio" name="fechaInicio" class="form-control" 
                     [(ngModel)]="seguroData.fechaInicio" required
                     [min]="minDate"> </div>

            <div class="form-group">
              <label for="fechaFin">Fecha Fin Vigencia *</label>
              <input type="date" id="fechaFin" name="fechaFin" class="form-control" 
                     [(ngModel)]="seguroData.fechaFin" required
                     [min]="seguroData.fechaInicio || minDate"> </div>

            <div class="form-group">
              <label for="costo">Costo Anual (CLP) *</label>
              <input type="number" id="costo" name="costo" class="form-control" 
                     [(ngModel)]="seguroData.costo" required 
                     placeholder="Ej: 350000" min="0" step="1000">
            </div>

            <div class="form-group">
              <label for="deducible">Deducible (UF) *</label>
              <input type="number" id="deducible" name="deducible" class="form-control" 
                     [(ngModel)]="seguroData.deducible" required 
                     placeholder="Ej: 3, 5, 10" min="0" step="0.5">
            </div>

          </div>

          <footer class="card__footer">
            <div class="footer-actions">
              <button type="button" class="btn btn--ghost" (click)="onCancel()" [disabled]="isLoading">
                Cancelar
              </button>
              <button type="submit" class="btn btn--primary" [disabled]="seguroForm.invalid || isLoading">
                <span *ngIf="!isLoading">
                  <i class="fas fa-save me-2"></i>Registrar Seguro
                </span>
                <span *ngIf="isLoading">
                  <i class="fas fa-spinner fa-spin me-2"></i>Registrando...
                </span>
              </button>
            </div>
          </footer>
        </form>
      </div>
    </section>
  </div>
</div>
